<h1>AXIS</h1>
<p>AXIS es un asistente personal de voz para un único ordenador Windows. Es de uso privado: no es un servicio público y no admite usuarios externos.</p>
<p>Con el permiso expreso de su dueño, AXIS lee el correo de Gmail y prepara borradores. Nunca envía nada sin confirmación.</p>
